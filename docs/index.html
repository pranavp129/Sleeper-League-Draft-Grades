<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Recaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --mv-black:    #0B0B0C;
    --mv-grey-900: #1D1D20;
    --mv-grey-700: #333338;
    --mv-grey-600: #6B6B70;
    --mv-grey-300: #C7C7CC;
    --mv-white:    #F5F5F2;
    --mv-gold:     #D4A72C;
    --mv-gold-dim: #8C7222;

    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--mv-black);
    color: var(--mv-white);
    font-family: var(--font-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--mv-gold); text-decoration: none; }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 0 3rem;
  }

  header.masthead {
    padding: 2.5rem 1.25rem 1.75rem;
    text-align: center;
    border-bottom: 3px solid var(--mv-gold);
  }

  header.masthead .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--mv-gold);
    margin: 0 0 0.5rem;
  }

  header.masthead h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 0;
    color: var(--mv-white);
  }

  .leagues {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding: 1.75rem 1.25rem 0;
  }

  .league-card {
    display: block;
    background: var(--mv-grey-900);
    border: 1px solid var(--mv-grey-700);
    border-radius: 6px;
    padding: 1.25rem 1.5rem;
    transition: border-color 0.15s ease;
  }

  .league-card:hover {
    border-color: var(--mv-gold-dim);
  }

  .league-name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.2rem;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    color: var(--mv-white);
    margin: 0 0 0.35rem;
  }

  .league-meta {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--mv-grey-300);
    margin: 0;
  }

  .empty-state {
    padding: 2rem 1.25rem;
    color: var(--mv-grey-600);
    text-align: center;
    font-size: 0.9rem;
  }

  footer.site-footer {
    text-align: center;
    padding: 2.5rem 1.25rem 1rem;
    color: var(--mv-grey-600);
    font-size: 0.78rem;
  }

  @media (min-width: 640px) {
    header.masthead h1 { font-size: 2.4rem; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <p class="eyebrow">Post-Draft Report Cards</p>
    <h1>Draft Recaps</h1>
  </header>

  <div class="leagues">
    
    <a class="league-card" href="just-for-funsies/">
      <p class="league-name">just for funsies</p>
      <p class="league-meta">2026 Season</p>
    </a>
    
    <a class="league-card" href="papa/">
      <p class="league-name">PAPA</p>
      <p class="league-meta">2026 Season</p>
    </a>
    
  </div>

  <footer class="site-footer">
    <p>Sleeper Draft Recap Generator</p>
  </footer>
</div>
</body>
</html>
